# Banc d'essai : compile les mods, lance un vrai serveur Forge, génère les chunks des lieux (outils/banc/zones.json)
# et range leurs blocs sur la branche « banc » (un seul commit, remplacé à chaque passage).
# Le rendu se fait ensuite hors du jeu : python3 outils/banc/rendu.py <lieu.npz> <image.png>
name: Banc d'essai

on:
  push:
    branches: ['lieux-*']
  workflow_dispatch:
    inputs:
      lieux:
        description: "Lieux à générer, séparés par des virgules (vide = tous)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: banc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # monde agrandi (10/11/2026) : 4 fois plus haut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Mods
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p lieux/libs
          cp build/libs/domaine_terre-*.jar lieux/libs/
          cd lieux && chmod +x gradlew && ./gradlew build --no-daemon

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy

      - uses: actions/cache@v4
        with:
          path: /tmp/serveur/libraries
          key: forge-serveur-1.20.1-47.4.10

      - name: Serveur Forge
        run: |
          mkdir -p /tmp/serveur && cd /tmp/serveur
          if [ ! -f libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt ]; then
            curl -fL --retry 5 -o installer.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
            java -jar installer.jar --installServer > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          rm -rf mods banc && mkdir mods
          cp $GITHUB_WORKSPACE/build/libs/domaine_terre-*.jar $GITHUB_WORKSPACE/lieux/build/libs/domaine_terre_lieux-*.jar mods/
          rm -f mods/*-sources.jar mods/*-slim.jar
          # Mods d'animaux du pack (10/11/2026) : sans eux le banc ne peut voir ni crocodile ni aucune bête d'Alex's Mobs.
          # Mêmes versions que l'instance « Refonte d'Aubin » ; pris sur Modrinth (échec = avertissement, banc sans eux).
          python - <<'EOF' || echo "::warning::mods d'animaux non téléchargés : banc sans Alex's Mobs"
          import json, urllib.request, urllib.parse
          VOULUS = {"alexs-mobs": "alexsmobs-1.22.9.jar", "citadel": "citadel-2.6.3-1.20.1.jar"}
          for slug, fichier in VOULUS.items():
              q = urllib.parse.urlencode({"loaders": '["forge"]', "game_versions": '["1.20.1"]'})
              req = urllib.request.Request(f"https://api.modrinth.com/v2/project/{slug}/version?{q}",
                                           headers={"User-Agent": "theMitch37/domaine-terre banc"})
              versions = json.load(urllib.request.urlopen(req, timeout=60))
              f = next((f for v in versions for f in v["files"] if f["filename"] == fichier), None)
              if f is None:
                  f = versions[0]["files"][0]
                  print(f"::warning::{fichier} introuvable sur Modrinth, pris {f['filename']}")
              urllib.request.urlretrieve(f["url"], "mods/" + f["filename"])
              print("téléchargé", f["filename"])
          EOF
          ls mods

      - name: Génération des lieux
        run: |
          set -o pipefail
          mkdir -p /tmp/banc
          python outils/banc/serveur.py /tmp/serveur outils/banc/zones.json /tmp/banc ${{ github.event.inputs.lieux }} 2>&1 | tee /tmp/banc_script.log

      - name: Résultats sur la branche banc
        if: always()
        run: |
          mkdir -p /tmp/banc
          cp /tmp/serveur/logs/latest.log /tmp/banc/latest.log 2>/dev/null || true
          cp /tmp/banc_script.log /tmp/banc/script.log 2>/dev/null || true
          cp -r /tmp/serveur/crash-reports /tmp/banc/ 2>/dev/null || true
          printf 'branche=%s\ncommit=%s\ndate=%s\nresultat=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "${{ job.status }}" > /tmp/banc/SOURCE.txt
          cd /tmp/banc
          git init -q -b banc
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Banc d'essai de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" banc
