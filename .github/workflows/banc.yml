# Banc d'essai : compile les mods, lance un vrai serveur Forge, génère les chunks des lieux (outils/banc/zones.json)
# et range leurs blocs sur la branche « banc » (un seul commit, remplacé à chaque passage).
# Le rendu se fait ensuite hors du jeu : python3 outils/banc/rendu.py <lieu.npz> <image.png>
name: Banc d'essai

on:
  push:
    branches: ['lieux-*']
  workflow_dispatch:
    inputs:
      lieux:
        description: "Lieux à générer, séparés par des virgules (vide = tous)"
        required: false
        default: ""
      echelle:
        description: "Échelle du monde : 250 (défaut, zones.json) ou 30 (zones30.json, résultats sur la branche banc-130)"
        required: false
        default: "250"

permissions:
  contents: write

concurrency:
  group: banc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Mods
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p lieux/libs
          cp build/libs/domaine_terre-*.jar lieux/libs/
          cd lieux && chmod +x gradlew && ./gradlew build --no-daemon

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy

      - uses: actions/cache@v4
        with:
          path: /tmp/serveur/libraries
          key: forge-serveur-1.20.1-47.4.10

      - name: Serveur Forge
        run: |
          mkdir -p /tmp/serveur && cd /tmp/serveur
          if [ ! -f libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt ]; then
            curl -fL --retry 5 -o installer.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
            java -jar installer.jar --installServer > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          rm -rf mods banc && mkdir mods
          cp $GITHUB_WORKSPACE/build/libs/domaine_terre-*.jar $GITHUB_WORKSPACE/lieux/build/libs/domaine_terre_lieux-*.jar mods/
          rm -f mods/*-sources.jar mods/*-slim.jar
          ls mods
          # relief fin (08/11/2026) : paquets déjà préparés (branche relief-fin), posés comme un pack hors ligne
          rm -rf domaine_terre/relief && mkdir -p domaine_terre/relief
          if git -C $GITHUB_WORKSPACE fetch -q --depth 1 origin relief-fin 2>/dev/null; then
            git -C $GITHUB_WORKSPACE archive FETCH_HEAD zones | tar -x -C /tmp
            find /tmp/zones -name '*.bin' -exec cp {} domaine_terre/relief/ \;
          fi
          ls domaine_terre/relief | head
          # sol 1:30 (09/11/2026) : paquets d'essai (branche sol-130), posés comme un pack hors ligne
          rm -rf domaine_terre/sol30 && mkdir -p domaine_terre/sol30
          if git -C $GITHUB_WORKSPACE fetch -q --depth 1 origin sol-130 2>/dev/null; then
            mkdir -p /tmp/sol && git -C $GITHUB_WORKSPACE archive FETCH_HEAD | tar -x -C /tmp/sol
            cp /tmp/sol/*.bin domaine_terre/sol30/ 2>/dev/null || true
          fi
          ls domaine_terre/sol30

      - name: Génération des lieux
        run: |
          set -o pipefail
          mkdir -p /tmp/banc
          Z=outils/banc/zones.json
          if [ "${{ github.event.inputs.echelle }}" = "30" ]; then
            Z=outils/banc/zones30.json
            export BANC_TYPE=domaine_terre:terre_30
          fi
          python outils/banc/serveur.py /tmp/serveur $Z /tmp/banc ${{ github.event.inputs.lieux }} 2>&1 | tee /tmp/banc_script.log

      - name: Résultats sur la branche banc
        if: always()
        run: |
          mkdir -p /tmp/banc
          cp /tmp/serveur/logs/latest.log /tmp/banc/latest.log 2>/dev/null || true
          cp /tmp/banc_script.log /tmp/banc/script.log 2>/dev/null || true
          cp -r /tmp/serveur/crash-reports /tmp/banc/ 2>/dev/null || true
          printf 'branche=%s\ncommit=%s\ndate=%s\nresultat=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "${{ job.status }}" > /tmp/banc/SOURCE.txt
          cd /tmp/banc
          git init -q -b banc
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          B=banc
          [ "${{ github.event.inputs.echelle }}" = "30" ] && B=banc-130
          git commit -q -m "Banc d'essai de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:$B
