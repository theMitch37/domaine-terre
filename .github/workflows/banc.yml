# Banc d'essai : compile les mods, lance un vrai serveur Forge, génère les chunks des lieux (outils/banc/zones.json)
# et range leurs blocs sur la branche « banc » (un seul commit, remplacé à chaque passage).
# Le rendu se fait ensuite hors du jeu : python3 outils/banc/rendu.py <lieu.npz> <image.png>
name: Banc d'essai

on:
  push:
    branches: ['lieux-*']
  workflow_dispatch:
    inputs:
      lieux:
        description: "Lieux à générer, séparés par des virgules (vide = tous)"
        required: false
        default: ""
      detail_relief:
        description: "Part du détail du relief fin (vide = réglage du mod)"
        required: false
        default: ""
      profil:
        description: "Profil Java Flight Recorder (oui / non) ; il ralentit un peu la génération"
        required: false
        default: "non"

permissions:
  contents: write

concurrency:
  group: banc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # monde agrandi (10/11/2026) : 4 fois plus haut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Mods
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p lieux/libs
          cp build/libs/domaine_terre-*.jar lieux/libs/
          cd lieux && chmod +x gradlew && ./gradlew build --no-daemon

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy

      - uses: actions/cache@v4
        with:
          path: /tmp/serveur/libraries
          key: forge-serveur-1.20.1-47.4.10

      - name: Serveur Forge
        run: |
          mkdir -p /tmp/serveur && cd /tmp/serveur
          if [ ! -f libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt ]; then
            curl -fL --retry 5 -o installer.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
            java -jar installer.jar --installServer > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          rm -rf mods banc && mkdir mods
          cp $GITHUB_WORKSPACE/build/libs/domaine_terre-*.jar $GITHUB_WORKSPACE/lieux/build/libs/domaine_terre_lieux-*.jar mods/
          rm -f mods/*-sources.jar mods/*-slim.jar
          # Mods d'animaux du pack et leurs dépendances (10/11/2026 : Alex's Mobs, Untamed Wilds, Naturalist, Let's Do,
          # Ecologics, Aquaculture, Savage and Ravage, Best Revived Animals, Critters and Companions), mêmes fichiers que
          # l'instance « Refonte d'Aubin » ; un mod introuvable ou sans ses dépendances est laissé de côté (avertissement)
          python $GITHUB_WORKSPACE/outils/banc/mods_animaux.py mods || echo "::warning::mods d'animaux non téléchargés"
          # réglages du pack comme sur l'instance (10/11/2026) : un premier démarrage crée les configs des mods, puis
          # generer_placement.py écrit le datapack domaine_terroirs (OpenLoader) et règle Untamed Wilds et Alex's Mobs
          rm -rf config && echo "eula=true" > eula.txt
          # (vrai démarrage puis arrêt : Untamed Wilds n'écrit sa config qu'au démarrage du serveur ; monde jeté ensuite)
          ( timeout 900 bash -c 'until grep -q "Done (" logs/latest.log 2>/dev/null; do sleep 5; done'; echo stop ) \
            | timeout 1000 java -Xmx6G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > init.log 2>&1 || true
          rm -rf world banc logs/latest.log
          ls config | head -40
          mkdir -p config/openloader/data
          (cd $GITHUB_WORKSPACE && python outils/generer_placement.py /tmp/serveur) || echo "::warning::réglages du pack non appliqués"
          ls mods
          # relief fin (08/11/2026) : paquets déjà préparés (branche relief-fin), posés comme un pack hors ligne
          rm -rf domaine_terre/relief && mkdir -p domaine_terre/relief
          if git -C $GITHUB_WORKSPACE fetch -q --depth 1 origin relief-fin 2>/dev/null; then
            git -C $GITHUB_WORKSPACE archive FETCH_HEAD zones | tar -x -C /tmp
            find /tmp/zones -name '*.bin' -exec cp {} domaine_terre/relief/ \;
          fi
          ls domaine_terre/relief | head
          if [ -n "${{ github.event.inputs.detail_relief }}" ]; then
            mkdir -p config && echo '{"actif": true, "detail": ${{ github.event.inputs.detail_relief }}}' > config/domaine_terre_relief.json
            cat config/domaine_terre_relief.json
          fi

      - name: Génération des lieux
        run: |
          set -o pipefail
          mkdir -p /tmp/banc
          # profil du serveur (10/11/2026 : monde agrandi plus lent) : enregistrement Java Flight Recorder, résumé plus bas
          if [ "${{ github.event.inputs.profil }}" = "oui" ]; then
            export JAVA_TOOL_OPTIONS="-XX:StartFlightRecording=filename=/tmp/prof.jfr,settings=profile,dumponexit=true"
          fi
          python outils/banc/serveur.py /tmp/serveur outils/banc/zones.json /tmp/banc ${{ github.event.inputs.lieux }} 2>&1 | tee /tmp/banc_script.log

      - name: Profil
        if: always()
        run: |
          mkdir -p /tmp/banc
          if [ -f /tmp/prof.jfr ]; then
            jfr print --events jdk.ExecutionSample /tmp/prof.jfr > /tmp/echant.txt 2>/dev/null || true
            python outils/banc/profil.py /tmp/echant.txt > /tmp/banc/profil.txt || true
            head -60 /tmp/banc/profil.txt
          fi

      - name: Résultats sur la branche banc
        if: always()
        run: |
          mkdir -p /tmp/banc
          cp /tmp/serveur/logs/latest.log /tmp/banc/latest.log 2>/dev/null || true
          cp /tmp/banc_script.log /tmp/banc/script.log 2>/dev/null || true
          cp /tmp/serveur/domaine_tailles.csv /tmp/banc/domaine_tailles.csv 2>/dev/null || true   # tailles d'origine
          ls /tmp/serveur/mods > /tmp/banc/mods.txt 2>/dev/null || true
          cp /tmp/serveur/config/untamedwilds-common.toml /tmp/banc/ 2>/dev/null || true
          # tables d'apparition propres d'Untamed Wilds (10/11/2026 : bêtes nées en plus de la table)
          (cd /tmp/banc && unzip -o -q /tmp/serveur/mods/untamedwilds-*.jar 'data/untamedwilds/spawn_tables/*' -d uw) 2>/dev/null || true
          unzip -l /tmp/serveur/config/openloader/data/domaine_terroirs.zip > /tmp/banc/datapack.txt 2>/dev/null || true
          cp -r /tmp/serveur/crash-reports /tmp/banc/ 2>/dev/null || true
          printf 'branche=%s\ncommit=%s\ndate=%s\nresultat=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "${{ job.status }}" > /tmp/banc/SOURCE.txt
          cd /tmp/banc
          git init -q -b banc
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Banc d'essai de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" banc
