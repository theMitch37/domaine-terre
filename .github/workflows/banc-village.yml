# Banc de Domaine Village (13/11/2026) : compile Terre et Domaine Village, lance un vrai serveur Forge et vérifie
# par /locate que les villages sont aux emplacements des vraies villes.
name: Banc Domaine Village

on:
  push:
    branches: ['village-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banc-village-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mods
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          mkdir -p village/libs
          cp build/libs/domaine_terre-*.jar village/libs/
          rm -f village/libs/*-sources.jar village/libs/*-slim.jar
          cd village && chmod +x gradlew && ./gradlew build --no-daemon

      - uses: actions/cache@v4
        with:
          path: /tmp/serveur/libraries
          key: forge-serveur-1.20.1-47.4.10

      - name: Serveur Forge
        run: |
          mkdir -p /tmp/serveur && cd /tmp/serveur
          if [ ! -f libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt ]; then
            curl -fL --retry 5 -o installer.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
            java -jar installer.jar --installServer > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          rm -rf mods village && mkdir mods
          cp $GITHUB_WORKSPACE/build/libs/domaine_terre-*.jar $GITHUB_WORKSPACE/village/build/libs/domaine_terre_village-*.jar mods/
          rm -f mods/*-sources.jar mods/*-slim.jar
          ls mods

      - name: Contrôles
        run: |
          mkdir -p /tmp/banc
          python outils/banc/village.py /tmp/serveur village/src/main/resources/domaine_terre_village/villages.csv /tmp/banc 2>&1 | tee /tmp/banc/script.log || true
          grep -q "ÉCHEC" /tmp/banc/bilan.txt && echo "::warning::contrôles en échec" || true

      - name: Résultats sur la branche banc-<branche>
        if: always()
        run: |
          mkdir -p /tmp/banc
          cp /tmp/serveur/logs/latest.log /tmp/banc/latest.log 2>/dev/null || true
          cp -r /tmp/serveur/crash-reports /tmp/banc/ 2>/dev/null || true
          ls /tmp/serveur/mods > /tmp/banc/mods.txt 2>/dev/null || true
          printf 'branche=%s\ncommit=%s\ndate=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > /tmp/banc/SOURCE.txt
          cd /tmp/banc
          git init -q -b banc
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Banc Domaine Village de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "banc:banc-$GITHUB_REF_NAME"
