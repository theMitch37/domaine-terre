# Embouchures réelles depuis HydroRIVERS (10/11/2026) : les tracés de fleuves.json restés à terre sont prolongés par
# le vrai cours d'aval jusqu'à la mer (outils/fleuves_hydro.py), puis fleuves_mer.py finit les derniers blocs.
# Lancé à la main ou en poussant sur une branche « fleuves-* » ; le résultat est ajouté à la branche.
name: Fleuves HydroRIVERS

on:
  push:
    branches: ['fleuves-*']
    paths:
      - outils/fleuves_hydro.py
      - .github/workflows/fleuves-hydro.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Place sur le disque (RiverATLAS fait plusieurs Go)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Outils Python
        run: pip install numpy scipy shapely pyogrio pandas pillow
      - name: Téléchargement et construction (journal toujours rapporté)
        run: |
          mkdir -p outils/donnees /tmp/hydro
          {
            set -e
            cd /tmp/hydro
            # data.hydrosheds.org refuse les téléchargements depuis GitHub (403) : RiverATLAS v1.0 (mêmes tronçons,
            # mêmes identifiants que HydroRIVERS) sur figshare, par son API publique
            curl -sSfL --retry 5 -o article.json https://api.figshare.com/v2/articles/9890531
            url=$(python -c "import json; d=json.load(open('article.json')); print([f['download_url'] for f in d['files'] if f['name']=='RiverATLAS_Data_v10_shp.zip'][0])")
            echo "RiverATLAS : $url ; licence : $(python -c "import json; print(json.load(open('article.json')).get('license', {}).get('name'))")"
            curl -sSfL --retry 5 --retry-delay 30 -o ra.zip "$url"
            ls -la ra.zip; df -h /
            # lu directement dans le zip (GDAL /vsizip/) : pas de décompression sur le disque
            cd $GITHUB_WORKSPACE
            python outils/fleuves_hydro.py /tmp/hydro/ra.zip
            python outils/fleuves_mer.py
          } > /tmp/journal.txt 2>&1 || echo "ÉCHEC" >> /tmp/journal.txt
          cp /tmp/journal.txt outils/donnees/fleuves_hydro.log; cat outils/donnees/fleuves_hydro.log
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f outils/donnees/fleuves_hydro.log
          [ -f outils/donnees/fleuves_hydro.json ] && git add -f outils/donnees/fleuves_hydro.json src/main/resources/domaine_terre/carte/fleuves.json
          git commit -m "Embouchures réelles HydroRIVERS (automatique)" || exit 0
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
# déclenché le 10/11/2026 (6 : tri par fid)
