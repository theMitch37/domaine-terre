# Mesure le coût d'un trait de côte haute résolution (GSHHG) face à Natural Earth 10m (étape B de la mer fidèle).
# Résultat : outils/donnees/mesure_cotes.txt, ajouté à la branche.
name: Mesure des côtes

on:
  push:
    branches: ['mesure-*']
    paths:
      - outils/mesure_cotes.py
      - .github/workflows/mesure-cotes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy scipy shapely pyogrio matplotlib
      - name: Téléchargement GSHHG 2.3.7 et Natural Earth 10m
        run: |
          mkdir -p /tmp/cotes && cd /tmp/cotes
          # premier passage : exit 60 (certificat) sur une des sources ; on essaie chaque miroir et on dit lequel répond
          ok=0
          for u in https://www.soest.hawaii.edu/pwessel/gshhg/gshhg-shp-2.3.7.zip \
                   https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhg/latest/gshhg-shp-2.3.7.zip \
                   http://www.soest.hawaii.edu/pwessel/gshhg/gshhg-shp-2.3.7.zip; do
            echo "== $u"
            if curl -fL --retry 3 --retry-delay 10 -o gshhg.zip "$u"; then ok=1; break; else echo "échec ($?)"; fi
          done
          [ $ok = 1 ] || exit 1
          unzip -q gshhg.zip -d gshhg
          # Natural Earth 10m depuis son dépôt GitHub (même données que naciscdn)
          base=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/10m_physical
          mkdir -p ne && for e in shp shx dbf prj; do curl -fL --retry 5 -o ne/ne_10m_land.$e $base/ne_10m_land.$e; done
          ls -la gshhg/GSHHS_shp/h gshhg/GSHHS_shp/f ne
      - name: Mesure
        run: |
          mkdir -p outils/donnees
          python outils/mesure_cotes.py /tmp/cotes/gshhg/GSHHS_shp /tmp/cotes/ne/ne_10m_land.shp outils/donnees/mesure_cotes.txt
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f outils/donnees/mesure_cotes.txt
          git commit -m "Mesure des côtes GSHHG / Natural Earth (automatique)" || exit 0
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
