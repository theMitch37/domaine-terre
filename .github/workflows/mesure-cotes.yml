# Mesure le coût d'un trait de côte haute résolution (GSHHG) face à Natural Earth 10m (étape B de la mer fidèle).
# Résultat : outils/donnees/mesure_cotes.txt, ajouté à la branche.
name: Mesure des côtes

on:
  push:
    branches: ['mesure-*']
    paths:
      - outils/mesure_cotes.py
      - .github/workflows/mesure-cotes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy scipy shapely pyogrio matplotlib
      - name: Téléchargement et mesure (journal toujours rapporté sur la branche)
        run: |
          mkdir -p outils/donnees /tmp/cotes
          J=$PWD/outils/donnees/mesure_cotes.txt
          {
            cd /tmp/cotes
            ok=0
            for u in https://www.soest.hawaii.edu/pwessel/gshhg/gshhg-shp-2.3.7.zip \
                     https://www.ngdc.noaa.gov/mgg/shorelines/data/gshhg/latest/gshhg-shp-2.3.7.zip \
                     http://www.soest.hawaii.edu/pwessel/gshhg/gshhg-shp-2.3.7.zip \
                     https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip; do
              echo "== $u"
              if curl -sSfL --retry 3 --retry-delay 10 -o gshhg.zip "$u"; then ok=1; echo "ok $(stat -c %s gshhg.zip) octets"; break; fi
            done
            base=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/10m_physical
            mkdir -p ne && for e in shp shx dbf prj; do curl -sSfL --retry 5 -o ne/ne_10m_land.$e $base/ne_10m_land.$e || echo "NE $e : échec"; done
            ls -la ne
            if [ $ok = 1 ]; then
              unzip -q gshhg.zip -d gshhg && ls gshhg/GSHHS_shp/h | head
              cd $GITHUB_WORKSPACE
              python outils/mesure_cotes.py /tmp/cotes/gshhg/GSHHS_shp /tmp/cotes/ne/ne_10m_land.shp /tmp/cotes/resultat.txt && cat /tmp/cotes/resultat.txt
            fi
          } > /tmp/journal.txt 2>&1 || true
          cp /tmp/journal.txt "$J"; cat "$J"
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f outils/donnees/mesure_cotes.txt
          git commit -m "Mesure des côtes GSHHG / Natural Earth (automatique)" || exit 0
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
