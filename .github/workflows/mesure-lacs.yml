# Mesure pour l'étape C1 (lacs en altitude) : altitude de surface des lacs GSHHG lue dans Copernicus DEM GLO-90
# (AWS Open Data). HydroLAKES refuse le téléchargement automatique (403).
# Résultat : outils/donnees/mesure_lacs.txt, ajouté à la branche.
name: Mesure des lacs

on:
  push:
    branches: ['mesure-*']
    paths:
      - outils/mesure_lacs_dem.py
      - .github/workflows/mesure-lacs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy shapely pyogrio rasterio
      - name: Téléchargement et mesure (journal toujours rapporté sur la branche)
        run: |
          mkdir -p outils/donnees /tmp/lacs
          J=$PWD/outils/donnees/mesure_lacs.txt
          {
            cd /tmp/lacs
            curl -sSfL --retry 3 -o gshhg.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip \
              && unzip -q gshhg.zip 'GSHHS_shp/f/*' -d gshhg && ls gshhg/GSHHS_shp/f
            cd $GITHUB_WORKSPACE
            python outils/mesure_lacs_dem.py /tmp/lacs/gshhg/GSHHS_shp /tmp/lacs/mesure.txt
          } > /tmp/journal.txt 2>&1 || true
          cp /tmp/journal.txt "$J"; cat "$J"
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f outils/donnees/mesure_lacs.txt
          git commit -m "Mesure des lacs (automatique)" || exit 0
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
