# Mesure HydroLAKES pour l'étape C1 (lacs en altitude) : téléchargement, tailles, altitudes et profondeurs de lacs connus.
# Résultat : outils/donnees/mesure_lacs.txt, ajouté à la branche.
name: Mesure des lacs

on:
  push:
    branches: ['mesure-*']
    paths:
      - outils/mesure_hydrolakes.py
      - .github/workflows/mesure-lacs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy pyogrio
      - name: Téléchargement et mesure (journal toujours rapporté sur la branche)
        run: |
          mkdir -p outils/donnees /tmp/lacs
          J=$PWD/outils/donnees/mesure_lacs.txt
          {
            cd /tmp/lacs
            ok=0
            for u in https://data.hydrosheds.org/file/hydrolakes/HydroLAKES_polys_v10_shp.zip \
                     https://data.hydrosheds.org/file/hydrolakes/HydroLAKES_polys_v10_gdb.zip; do
              echo "== $u"
              if curl -sSfL --retry 3 --retry-delay 15 -o hl.zip "$u"; then ok=1; echo "ok $(stat -c %s hl.zip) octets"; break; fi
            done
            if [ $ok = 1 ]; then
              unzip -q hl.zip -d hl && find hl -maxdepth 3 | head -20
              shp=$(find hl -name '*.shp' | head -1); [ -z "$shp" ] && shp=$(find hl -name '*.gdb' | head -1)
              cd $GITHUB_WORKSPACE
              python outils/mesure_hydrolakes.py "/tmp/lacs/$shp" /tmp/lacs/mesure.txt && cat /tmp/lacs/mesure.txt
            fi
          } > /tmp/journal.txt 2>&1 || true
          cp /tmp/journal.txt "$J"; cat "$J"
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f outils/donnees/mesure_lacs.txt
          git commit -m "Mesure HydroLAKES (automatique)" || exit 0
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
