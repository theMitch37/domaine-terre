# Emplacements fixes des villages de Domaine Village (13/11/2026) : villes GeoNames (cities1000, CC BY 4.0), une par
# case de 512 blocs, poussée sur un sol constructible du mod Terre (outils/villages.py). Résultat ajouté à la branche :
# village/src/main/resources/domaine_terre_village/villages.csv
name: Villages

on:
  push:
    branches-ignore: [jars]
    paths:
      - outils/villages.py
      - .github/workflows/villages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  villages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install numpy pillow scipy
      - name: Villes GeoNames
        run: |
          curl -fL --retry 5 --retry-delay 20 -o /tmp/cities1000.zip https://download.geonames.org/export/dump/cities1000.zip
          cd /tmp && unzip -o -q cities1000.zip && wc -l cities1000.txt
      - name: Placement des villages
        run: python3 outils/villages.py /tmp/cities1000.txt village/src/main/resources/domaine_terre_village/villages.csv
      - name: Ajout à la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f village/src/main/resources/domaine_terre_village/villages.csv
          git commit -m "Villages : emplacements tirés de GeoNames (automatique) [skip ci]" || exit 0
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
