# Découpe le relief Copernicus DEM GLO-30 autour des lieux uniques (outils/relief_lieu.py).
# Le résultat (outils/donnees/relief_<lieu>.npz, quelques Mo) est ajouté à la branche.
# Se lance quand l'outil ou ce fichier change, ou à la main.
name: Relief des lieux

on:
  push:
    branches-ignore: [jars]
    paths:
      - outils/relief_lieu.py
      - outils/couverture_lieu.py
      - .github/workflows/relief-lieux.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install rasterio numpy
      - name: Verdon
        if: false
        run: |
          mkdir -p /tmp/dem outils/donnees
          D=Copernicus_DSM_COG_10_N43_00_E006_00_DEM
          curl -fL --retry 5 --retry-delay 20 -o /tmp/dem/$D.tif \
            "https://copernicus-dem-30m.s3.amazonaws.com/$D/$D.tif"
          python outils/relief_lieu.py /tmp/dem/$D.tif verdon 6.05 6.60 43.60 43.95
      - name: gavarnie
        if: false
        run: |
          mkdir -p /tmp/dem outils/donnees
          D=Copernicus_DSM_COG_10_N42_00_W001_00_DEM
          curl -fL --retry 5 --retry-delay 20 -o /tmp/dem/$D.tif "https://copernicus-dem-30m.s3.amazonaws.com/$D/$D.tif"
          D=Copernicus_DSM_COG_10_N42_00_E000_00_DEM
          curl -fL --retry 5 --retry-delay 20 -o /tmp/dem/$D.tif "https://copernicus-dem-30m.s3.amazonaws.com/$D/$D.tif"
