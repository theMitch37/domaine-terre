# Inspection (09/11/2026) : signatures du rendu des fluides dans Forge 1.20.1 et Embeddium, pour les mixins de l'eau.
name: Inspection du rendu de l'eau

on:
  push:
    branches: [echelle-130]
    paths: [.github/workflows/inspection.yml]

jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon -q
      - name: Forge
        run: |
          J=$(find ~/.gradle/caches -name "forge-1.20.1-*_mapped_official_1.20.1.jar" | grep -v sources | head -1)
          for c in net.minecraft.client.renderer.texture.SpriteContents net.minecraft.client.renderer.texture.atlas.SpriteSource \
                   'net.minecraft.client.renderer.texture.atlas.SpriteSource$Output' 'net.minecraft.client.renderer.texture.atlas.SpriteSource$SpriteSupplier' \
                   net.minecraft.client.renderer.texture.atlas.SpriteSourceType net.minecraft.client.renderer.texture.atlas.SpriteSources \
                   net.minecraft.client.renderer.texture.atlas.sources.SingleFile net.minecraft.client.renderer.texture.SpriteLoader \
                   net.minecraftforge.client.event.RegisterSpriteSourceTypesEvent net.minecraft.client.renderer.texture.atlas.sources.LazyLoadedImage; do
            echo "=== $c"; javap -p -classpath "$J" "$c" 2>&1 | grep -v "lambda\$" | head -40
          done
          echo "=== getFluidSprites"; javap -p -c -classpath "$J" net.minecraftforge.client.ForgeHooksClient | grep -A30 "getFluidSprites(" | head -40
          echo "=== SingleFile.run"; javap -p -c -classpath "$J" net.minecraft.client.renderer.texture.atlas.sources.SingleFile | grep -B2 -A40 " run(" | head -60
          echo "=== SpriteLoader.loadSprite"; javap -p -c -classpath "$J" net.minecraft.client.renderer.texture.SpriteLoader | grep -A60 "loadSprite(" | grep -E "invoke|new|loadSprite" | head -30
          unzip -p "$J" assets/minecraft/atlases/blocks.json 2>/dev/null || find ~/.gradle/caches -name "client-extra*.jar" -exec unzip -p {} assets/minecraft/atlases/blocks.json \; | head -c 600
      - name: Embeddium
        run: |
          mkdir -p /tmp/emb && cd /tmp/emb
          curl -sL -o emb.jar https://cdn.modrinth.com/data/sk9rgfiA/versions/UTbfe5d1/embeddium-0.3.31%2Bmc1.20.1.jar
          javap -p -c -classpath emb.jar org.embeddedt.embeddium.render.fluid.EmbeddiumFluidSpriteCache | head -120
