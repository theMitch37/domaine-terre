# Compile le mod Terre puis les addons Lieux uniques et Domaine Weather à chaque envoi sur GitHub.
# Les jars sont téléchargeables dans l'onglet Actions (section « Artifacts » du run).
name: Compilation

on:
  push:
    branches-ignore: [jars]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Mod Terre
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Addon Lieux uniques
        run: |
          mkdir -p lieux/libs
          cp build/libs/domaine_terre-*.jar lieux/libs/
          cd lieux
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Addon Domaine Weather
        run: |
          mkdir -p meteo/libs
          cp build/libs/domaine_terre-*.jar meteo/libs/
          rm -f meteo/libs/*-sources.jar meteo/libs/*-slim.jar
          python3 outils/meteo_libs.py meteo/libs
          cd meteo
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        continue-on-error: true            # stockage des artifacts plein : les jars vont de toute façon sur la branche jars
        with:
          name: mods-domaine-aubin
          path: |
            build/libs/domaine_terre-*.jar
            lieux/build/libs/domaine_terre_lieux-*.jar
            meteo/build/libs/domaine_weather-*.jar

      # Range aussi les jars sur la branche « jars » (un seul commit, remplacé à chaque compilation),
      # pour pouvoir les récupérer avec git sans passer par le stockage des artifacts.
      - name: Publier les jars sur la branche jars
        run: |
          mkdir -p /tmp/jars
          cp build/libs/domaine_terre-*.jar lieux/build/libs/domaine_terre_lieux-*.jar meteo/build/libs/domaine_weather-*.jar /tmp/jars/
          rm -f /tmp/jars/*-sources.jar /tmp/jars/*-slim.jar
          printf 'branche=%s\ncommit=%s\ndate=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > /tmp/jars/SOURCE.txt
          cd /tmp/jars
          git init -q -b jars
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jars de $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jars
